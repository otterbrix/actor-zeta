name: Ubuntu Sanitizers CI

# Four configurations the main matrix does not cover, each catching a class of defect
# an ordinary build is blind to:
#
#   asan       -- use-after-free and bad-free (a freed coroutine frame handed out
#                 through a unique_future, PMR memory freed with the global allocator).
#   tsan       -- data races, including Catch2 assertion macros called from worker
#                 threads, which are a race in Catch2 v2 itself.
#   ubsan      -- undefined behaviour neither of the above sees (an over-wide shift in
#                 exponential_backoff() once passed both). -fno-sanitize-recover=all so
#                 a report fails the job instead of being printed and walked past.
#   exceptions -- EXCEPTIONS_DISABLE=OFF. The exception_ptr capture/rethrow path in
#                 unique_future exists ONLY in this mode (with -fno-exceptions the
#                 compiler emits no catch wrapper for a coroutine body), and it is the
#                 mode consumers that enable exceptions build in.

on:
  pull_request:
  push:
    branches:
      - master

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        check:
          - name: asan
            cxx_flags: "-fsanitize=address -fno-omit-frame-pointer"
            link_flags: "-fsanitize=address"
            exceptions_disable: "ON"
          - name: tsan
            cxx_flags: "-fsanitize=thread -fno-omit-frame-pointer"
            link_flags: "-fsanitize=thread"
            exceptions_disable: "ON"
          - name: ubsan
            cxx_flags: "-fsanitize=undefined -fno-sanitize-recover=all -fno-omit-frame-pointer"
            link_flags: "-fsanitize=undefined"
            exceptions_disable: "ON"
          - name: exceptions
            cxx_flags: ""
            link_flags: ""
            exceptions_disable: "OFF"

    name: ${{ matrix.check.name }}
    runs-on: ubuntu-latest
    container:
      image: ubuntu:22.04

    steps:
      - uses: actions/checkout@v3

      - name: Install system dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt update && apt-get install -y \
            software-properties-common ca-certificates \
            ninja-build make zlib1g-dev wget \
            python3-pip python3 python3-dev python3-setuptools

          add-apt-repository ppa:ubuntu-toolchain-r/test

          bash ./docker/gcc/pyinstall.sh $(cat /etc/os-release | grep -a UBUNTU_CODENAME | sed -e 's/UBUNTU_CODENAME=//g')

          python3 -m pip install --upgrade pip
          python3 -m pip install --no-cache-dir "conan==2.*" cmake==3.25.0

      - name: Install compiler
        run: |
          apt update && apt-get install -y gcc-13 g++-13
          update-alternatives \
            --install /usr/bin/gcc gcc /usr/bin/gcc-13 90 \
            --slave /usr/bin/g++ g++ /usr/bin/g++-13 \
            --slave /usr/bin/gcov gcov /usr/bin/gcov-13
          update-alternatives --config gcc

      - name: Configure CMake
        env:
          CC: gcc-13
          CXX: g++-13
        run: |
          conan profile detect --force
          conan install . --output-folder=build/Debug -s build_type=Debug --build=missing

          TOOLCHAIN_PATH="$(pwd)/build/Debug/conan_toolchain.cmake"

          # Benchmarks are off: they measure, and a sanitizer makes the numbers
          # meaningless while adding minutes to the job.
          cmake -S . -B build/Debug -GNinja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_STANDARD=20 \
            -DCMAKE_C_COMPILER=${CC} \
            -DCMAKE_CXX_COMPILER=${CXX} \
            -DALLOW_EXAMPLES=ON \
            -DALLOW_TESTS=ON \
            -DALLOW_BENCHMARK=OFF \
            -DEXCEPTIONS_DISABLE=${{ matrix.check.exceptions_disable }} \
            -DRTTI_DISABLE=ON \
            -DCMAKE_CXX_FLAGS="${{ matrix.check.cxx_flags }}" \
            -DCMAKE_EXE_LINKER_FLAGS="${{ matrix.check.link_flags }}" \
            -DCMAKE_TOOLCHAIN_FILE=${TOOLCHAIN_PATH}

      - name: Build
        run: cmake --build build/Debug

      - name: Test
        working-directory: build/Debug
        env:
          # detect_leaks=1: dropping a future destroys its producer frame even mid-body, and
          # destroying an actor unwinds its suspended chain first -- nothing is left to leak.
          # halt_on_error fails the job on the FIRST report instead of running on past
          # corrupted state; second_deadlock_stack gives both stacks for a lock-order
          # inversion.
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:abort_on_error=1
          TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --output-on-failure
